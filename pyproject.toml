[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcx-utilities"
version = "0.1.0"
description = "Extract heart rate and loop-pacing data from Garmin TCX files"
requires-python = ">=3.10"

[project.scripts]
heart-rate-extractor = "tcx_utilities.heart_rate_extractor:main"
timing-loop-pacing = "tcx_utilities.timing_loop_pacing:main"

[tool.setuptools.packages.find]
include = ["tcx_utilities*"]
